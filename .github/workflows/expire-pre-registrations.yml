name: Expirar pré-inscrições

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: expire-pre-registrations
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de expiração
        run: |
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://bate-lata.vercel.app/api/cron/expire-pre-registrations
